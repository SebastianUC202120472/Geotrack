server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asistente virtual con IA (servicio aparte). El nombre se resuelve en cada peticion
    # (resolver de Docker + variable): si el contenedor no existe, Nginx igual arranca y
    # el widget simplemente no aparece. Sin buffer para que la respuesta llegue mientras
    # se escribe (streaming).
    location /api/asistente/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $asistente_upstream http://asistente:8100;
        proxy_pass $asistente_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host (no $host) conserva el puerto: sin el, un redirect del backend
        # —por ejemplo el 307 de la barra final— apunta a http://localhost/... y se cae.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        # $http_host (no $host) conserva el puerto: sin el, un redirect del backend
        # —por ejemplo el 307 de la barra final— apunta a http://localhost/... y se cae.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # $http_host (no $host) conserva el puerto: sin el, un redirect del backend
        # —por ejemplo el 307 de la barra final— apunta a http://localhost/... y se cae.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
