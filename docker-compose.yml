services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      # Modulo de catalogo y capacidad (Idea 3). En false el modulo no se registra.
      MODULO_CAPACIDAD_ENABLED: ${MODULO_CAPACIDAD_ENABLED:-true}
      # Modulo de mantenimiento y documentos de la flota (Idea 4). En false el modulo no se registra.
      MODULO_MANTENIMIENTO_ENABLED: ${MODULO_MANTENIMIENTO_ENABLED:-true}
      # Modo demostracion del portal de empresa: con SMTP apagado el login no puede
      # enviar el OTP, y en true el backend lo devuelve para mostrarlo en pantalla.
      # NO activar en produccion: expone un factor de autenticacion.
      PORTAL_OTP_DEMO: ${PORTAL_OTP_DEMO:-false}
      # Modo demostracion del almacen: en true, la solicitud aceptada se recibe directo en
      # "Ingreso a Almacen" sin ruta de recojo ni fotos. NO activar en produccion.
      ALMACEN_INGRESO_DIRECTO: ${ALMACEN_INGRESO_DIRECTO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Procesos de uvicorn (1 por defecto; el limitador de intentos es por proceso).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_GEOCODING_KEY: ${GOOGLE_GEOCODING_KEY:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SAVA S.A.C.}
      MAIL_SIGNATURE: ${MAIL_SIGNATURE:-}
      # Datos del proveedor en el Libro de Reclamaciones (C40-02).
      EMPRESA_RAZON_SOCIAL: ${EMPRESA_RAZON_SOCIAL:-SAVA S.A.C.}
      EMPRESA_RUC: ${EMPRESA_RUC:-}
      EMPRESA_DIRECCION: ${EMPRESA_DIRECCION:-Calle Los Sinchis Nro. 166, Urb. Tahuantinsuyo Zona III, Independencia, Lima}
      # Archivos (EX-08): "local" usa el volumen backend_uploads; "supabase" guarda en Supabase Storage.
      ALMACENAMIENTO: ${ALMACENAMIENTO:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-geotrack}
      # Centro de notificaciones automaticas (Idea 5): el backend atiende los webhooks y el
      # panel; el servicio "notificador" detecta los eventos y envia. Apagado por defecto.
      NOTIFICACIONES_HABILITADAS: ${NOTIFICACIONES_HABILITADAS:-false}
      NOTIFICACIONES_INTERVALO_SEG: ${NOTIFICACIONES_INTERVALO_SEG:-30}
      NOTIFICACIONES_ADMIN_TELEGRAM_CHAT_ID: ${NOTIFICACIONES_ADMIN_TELEGRAM_CHAT_ID:-}
      NOTIFICACIONES_ALMACEN_EMAIL: ${NOTIFICACIONES_ALMACEN_EMAIL:-}
      NOTIFICACIONES_URL_PORTAL: ${NOTIFICACIONES_URL_PORTAL:-https://sava.pe/portal}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Secretos que prueban que la llamada al webhook viene de Telegram / Meta (vacios = se rechaza).
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    volumes:
      - backend_uploads:/app/uploads
      # Registro de errores (EX-11): sobrevive a la reconstruccion del contenedor.
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Notificador: lee las novedades del nucleo, arma los avisos y los envia (SMTP, Telegram,
  # WhatsApp). Con NOTIFICACIONES_HABILITADAS=false solo espera y no abre conexiones.
  notificador:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.services.notificaciones_automaticas.servicio_notificador
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SAVA S.A.C.}
      NOTIFICACIONES_HABILITADAS: ${NOTIFICACIONES_HABILITADAS:-false}
      NOTIFICACIONES_INTERVALO_SEG: ${NOTIFICACIONES_INTERVALO_SEG:-30}
      NOTIFICACIONES_ADMIN_TELEGRAM_CHAT_ID: ${NOTIFICACIONES_ADMIN_TELEGRAM_CHAT_ID:-}
      NOTIFICACIONES_ALMACEN_EMAIL: ${NOTIFICACIONES_ALMACEN_EMAIL:-}
      NOTIFICACIONES_URL_PORTAL: ${NOTIFICACIONES_URL_PORTAL:-https://sava.pe/portal}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Lima}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Asistente virtual con IA del panel (Idea 1). Servicio aparte: consulta la API del
  # backend con el token del usuario y guarda su historial en el esquema "asistente" de la
  # misma base. Las acciones (con confirmacion) solo con ASISTENTE_ACCIONES_ENABLED=true.
  # Se apaga con ASISTENTE_ENABLED=false sin afectar al resto del sistema.
  asistente:
    build: ./asistente
    environment:
      ASISTENTE_ENABLED: ${ASISTENTE_ENABLED:-false}
      ASISTENTE_ACCIONES_ENABLED: ${ASISTENTE_ACCIONES_ENABLED:-false}
      ASISTENTE_DATABASE_URL: ${DATABASE_URL}
      ASISTENTE_CORE_API_URL: http://backend:8000/api
      ASISTENTE_PROVEEDORES: ${ASISTENTE_PROVEEDORES:-gemini,groq,groq_respaldo,openrouter,ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELO: ${GEMINI_MODELO:-gemini-3.5-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODELO: ${GROQ_MODELO:-openai/gpt-oss-120b}
      GROQ_MODELO_RESPALDO: ${GROQ_MODELO_RESPALDO-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELO: ${OPENROUTER_MODELO:-nvidia/nemotron-3.5-super-vl:free}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODELO: ${OLLAMA_MODELO:-qwen2.5:7b}
      ASISTENTE_IA_TIMEOUT_SEG: ${ASISTENTE_IA_TIMEOUT_SEG:-20}
      ASISTENTE_IA_PRIMER_FRAGMENTO_SEG: ${ASISTENTE_IA_PRIMER_FRAGMENTO_SEG:-20}
      ASISTENTE_MENSAJES_POR_MINUTO: ${ASISTENTE_MENSAJES_POR_MINUTO:-10}
      ASISTENTE_MENSAJES_POR_DIA: ${ASISTENTE_MENSAJES_POR_DIA:-200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:
