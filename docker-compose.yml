services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      # Modo demostracion del portal de empresa: con SMTP apagado el login no puede
      # enviar el OTP, y en true el backend lo devuelve para mostrarlo en pantalla.
      # NO activar en produccion: expone un factor de autenticacion.
      PORTAL_OTP_DEMO: ${PORTAL_OTP_DEMO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_GEOCODING_KEY: ${GOOGLE_GEOCODING_KEY:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SAVA S.A.C.}
      MAIL_SIGNATURE: ${MAIL_SIGNATURE:-}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:5173"
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
